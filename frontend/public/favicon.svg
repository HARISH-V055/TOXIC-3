<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Atom nucleus -->
  <circle cx="32" cy="32" r="5" fill="url(#g1)" filter="url(#glow)"/>
  <!-- Electron orbit 1 (horizontal ellipse) -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="url(#g1)" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Electron orbit 2 (rotated 60deg) -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="url(#g1)" stroke-width="1.5" fill="none" opacity="0.6"
    transform="rotate(60 32 32)"/>
  <!-- Electron orbit 3 (rotated 120deg) -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="url(#g1)" stroke-width="1.5" fill="none" opacity="0.4"
    transform="rotate(120 32 32)"/>
  <!-- Electrons -->
  <circle cx="54" cy="32" r="2.5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="21" cy="22" r="2.5" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="21" cy="42" r="2.5" fill="#06b6d4" filter="url(#glow)"/>
</svg>
