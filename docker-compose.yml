version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: molxai_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-password}
      MONGO_INITDB_DATABASE: molxai
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - molxai_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: molxai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-password}@mongodb:27017/molxai?authSource=admin
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - molxai_net

  ai-service:
    build:
      context: ./ai
      dockerfile: ../docker/ai.Dockerfile
    container_name: molxai_ai
    restart: unless-stopped
    env_file:
      - ./ai/.env.example
    ports:
      - "8000:8000"
    networks:
      - molxai_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: molxai_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - molxai_net

volumes:
  mongo_data:
    driver: local

networks:
  molxai_net:
    driver: bridge
